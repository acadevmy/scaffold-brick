packages:
  - 'applications/*'
  - 'libraries/*'

# pnpm 11+ no longer reads the "pnpm" field of package.json nor the project
# .npmrc settings: workspace settings live here.
autoInstallPeers: true

requiredScripts:
  - build
  - test
  - lint
  - lint:fix

supportedArchitectures:
  os:
    - win32
    - darwin
    - current
  cpu:
    - x64
    - arm64

# Dependencies allowed to run install scripts. pnpm fails the install
# (ERR_PNPM_IGNORED_BUILDS) on any build it was not told about, and the devmy
# CLI installs without a terminal, so nothing can be approved interactively.
# Add here what new applications need (`pnpm approve-builds`).
allowBuilds:
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  # Telemetry only: denied.
  '@scarf/scarf': false

peerDependencyRules:
  allowedVersions:
    # Next.js application (Storybook + Vite) runs on TypeScript 6.
    tsconfck>typescript: '6'
